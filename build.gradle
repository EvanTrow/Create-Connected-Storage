plugins {
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = project.group

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

sourceSets {
    // GameTests that check linking on a headless server. Never part of the released jar.
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.gametest)

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
            ideName = "Client"
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            ideName = "Server"
            gameDirectory = project.file('runs/server')
        }
        gameTestServer {
            type = "gameTestServer"
            ideName = "GameTests"
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('runs/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

configurations {
    // Mods only needed when running the game from the dev environment, never published as dependencies.
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven { url = "https://maven.createmod.net" }           // Create, Ponder, Flywheel
    maven { url = "https://mvn.devos.one/snapshots" }       // Registrate
    exclusiveContent {                                      // Create: Connected (optional, dev runtime only)
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    // Flywheel ships inside Create's jar; compile against it for the pump's spinning-cog visual.
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") { transitive = false }

    // Create: Connected is an optional runtime integration (Item Silo). Nothing compiles against it.
    localRuntime("maven.modrinth:create-connected:${create_connected_version}") { transitive = false }
}

processResources {
    var replaceProperties = [
        mod_id                      : mod_id,
        mod_name                    : mod_name,
        mod_version                 : mod_version,
        mod_author                  : mod_author,
        description                 : description,
        minecraft_version_range     : minecraft_version_range,
        neoforge_loader_version_range: neoforge_loader_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
